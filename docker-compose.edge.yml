# Production overlay for the shared Lightsail host, where this site sits
# behind the edge proxy that fronts every site there (owned by the blastjax
# repo - see its docker/edge/) instead of running a Caddy of its own. The
# deploy workflow uses it whenever the host has that proxy installed:
#
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml ...
#
# Passing -f explicitly also means docker-compose.override.yml (local-only
# host port) is never merged in there.
services:
  web:
    networks:
      edge:
        aliases: [portfolio-web]
  # The edge proxy owns ports 80/443 on the host, so this stack's own Caddy
  # must not start there. A profile nothing enables keeps it defined (so the
  # deploy can still `rm -sf caddy` a container left from a standalone run)
  # without ever starting it.
  caddy:
    profiles: [standalone]

networks:
  edge:
    external: true
