<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Film Portfolio</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Film Portfolio</h1>
    <div class="header-actions">
      <button id="logoutBtn" class="btn hidden">Log out</button>
      <button id="openUpload" class="btn btn-primary hidden">+ Upload photo</button>
    </div>
  </header>

  <main>
    <section id="empty" class="empty hidden">
      <p>No photos yet.</p>
    </section>
    <div id="gallery" class="gallery"></div>
  </main>

  <!-- Upload dialog -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="closeUpload" aria-label="Close">&times;</button>
      <h2>Upload photo</h2>
      <form id="uploadForm">
        <label class="field">
          <span>Photo file</span>
          <input type="file" name="photo" id="photoInput" accept="image/*" required />
        </label>
        <img id="filePreview" class="file-preview hidden" alt="Selected preview" />

        <label class="field">
          <span>Title</span>
          <input type="text" name="title" id="titleInput" placeholder="Golden hour, Big Sur" required />
        </label>

        <label class="field">
          <span>Date taken (optional)</span>
          <div class="date-fields">
            <select id="monthInput" aria-label="Month"></select>
            <input type="number" id="yearInput" aria-label="Year" placeholder="Year" min="1826" max="2100" step="1" />
          </div>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Upload</button>
          <span id="uploadStatus" class="status"></span>
        </div>
      </form>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-toolbar">
      <button id="editPhoto" class="btn hidden">Edit</button>
      <button id="deletePhoto" class="btn hidden">Delete</button>
      <button class="lightbox-close" id="closeLightbox" aria-label="Close">&times;</button>
    </div>

    <img id="lightboxImg" alt="" />

    <div class="lightbox-caption" id="captionView">
      <span id="lightboxTitle"></span>
      <span id="lightboxDate"></span>
    </div>

    <form class="edit-form hidden" id="editForm">
      <input type="text" id="editTitleInput" class="edit-title-input" placeholder="Title" required />
      <div class="date-fields edit-date-fields">
        <select id="editMonthInput" aria-label="Month"></select>
        <input type="number" id="editYearInput" aria-label="Year" placeholder="Year" min="1826" max="2100" step="1" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn" id="cancelEdit">Cancel</button>
        <span id="editStatus" class="status"></span>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
